  skip: false
  filter: true
  bspline: true
  swap: true
  affine: true
  gtpp: false
  params:
    filter:
      filter_size: 3
      mode: "reflect"
    bspline:
      spacing_: [1.0, 1.0, 1.0]
      size_: [128, 128, 128]
    gtpp:
      model_dir: ""
      file_paths:
        data_dir: "/gpfs/projects/imva/Ultrasound_data"
