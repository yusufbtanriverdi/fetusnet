        perceptual_loss: false
        limit_translation: 0.5
        euler: false
        vgg: "11"
        image_loss: true
        instance_norm: false
        data_augment_close: true
        net: "SN16"
        latent: 128
        latent2: 64
        last_bn: false
        name_model_old: false
        grid_loss: true
        only_grid_loss: true
        dropout: 0.5
      dic_name: "dictionary_transform_yusuf"
