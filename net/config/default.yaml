        samples:
          train_samples: ""
          val_samples: ""
          test_samples: ""
        list_files:
          train_list_file: "/train_list_ga.txt"
          val_list_file: "/val_list_ga.txt"
          test_list_file: "/test_list_ga.txt"
      params:
        desired_size: [256, 256, 256]
        save_jpg: false
        save_nrrd: false
        downsampling_factor: 2
        spacing: 0.3
        permute: true
        input_plane: 3
        resume: true
        learning_rate: 0.0001
